    <text x="0" y="90" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-1.6">ENZO PINOTTI</text>
    <rect x="0" y="108" width="430" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="146" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">PRODUCT SYSTEMS · DELIVERY · AI · INFRASTRUCTURE</text>
    <text x="0" y="188" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">I connect business context, system design and delivery into</text>
    <text x="0" y="213" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">software that teams can understand, verify and trust.</text>
    <g transform="translate(0 246)">
