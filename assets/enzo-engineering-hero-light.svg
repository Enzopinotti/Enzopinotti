<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Enzo Pinotti — Product Systems, AI and Infrastructure</title>
  <desc id="desc">Light engineering control-room style banner with an abstract system map connecting web, API, data, AI and delivery layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1015" cy="58" r="170" fill="#8B5CF6" opacity="0.06"/>
  <circle cx="1110" cy="278" r="160" fill="#0EA5E9" opacity="0.07"/>

  <g transform="translate(64 58)">
    <rect width="78" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/>
    <circle cx="14" cy="13" r="4" fill="#0891B2" filter="url(#glow)"/>
    <text x="27" y="17" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SYSTEM</text>

    <text x="0" y="88" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-1.6">ENZO PINOTTI</text>
    <rect x="0" y="106" width="395" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="145" fill="#6D28D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">PRODUCT ENGINEERING · AI · INFRASTRUCTURE</text>

    <text x="0" y="186" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">I turn messy real-world processes into systems that are</text>
    <text x="0" y="211" fill="#1E293B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">clear, testable, observable and useful.</text>

    <g transform="translate(0 244)">
      <rect width="124" height="34" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="62" y="22" text-anchor="middle" fill="#0369A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">FULL STACK</text>
      <rect x="136" width="126" height="34" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="199" y="22" text-anchor="middle" fill="#7C3AED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">PRODUCT</text>
      <rect x="274" width="126" height="34" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="337" y="22" text-anchor="middle" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">SYSTEMS</text>
    </g>
  </g>

  <g transform="translate(690 42)">
    <rect width="438" height="276" rx="22" fill="#FFFFFF" fill-opacity="0.8" stroke="#CBD5E1"/>
    <text x="24" y="34" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1">LIVE ARCHITECTURE MAP</text>
    <circle cx="398" cy="28" r="4" fill="#0891B2" filter="url(#glow)"/>
    <circle cx="414" cy="28" r="4" fill="#7C3AED"/>

    <g stroke="#CBD5E1" stroke-width="2" fill="none">
      <path d="M82 93 C140 58 165 63 218 104"/>
      <path d="M218 104 C272 77 315 75 355 107"/>
      <path d="M218 104 C212 143 215 165 219 203"/>
      <path d="M82 93 C96 142 126 171 162 205"/>
      <path d="M162 205 C185 220 199 220 219 203"/>
      <path d="M219 203 C270 219 312 199 348 172"/>
      <path d="M355 107 C362 128 359 148 348 172"/>
    </g>

    <g>
      <circle cx="82" cy="93" r="30" fill="#EFF6FF" stroke="#0284C7" stroke-width="2"/>
      <text x="82" y="90" text-anchor="middle" fill="#075985" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">WEB</text>
      <text x="82" y="105" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8">UX</text>

      <circle cx="218" cy="104" r="36" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
      <text x="218" y="101" text-anchor="middle" fill="#5B21B6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">API</text>
      <text x="218" y="117" text-anchor="middle" fill="#7C6CA6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8">DOMAIN</text>

      <circle cx="355" cy="107" r="30" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
      <text x="355" y="104" text-anchor="middle" fill="#155E75" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">DATA</text>
      <text x="355" y="119" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8">SQL</text>

      <circle cx="162" cy="205" r="31" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
      <text x="162" y="202" text-anchor="middle" fill="#6D28D9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">AI</text>
      <text x="162" y="217" text-anchor="middle" fill="#7C6CA6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8">TOOLS</text>

      <circle cx="219" cy="203" r="23" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
      <text x="219" y="207" text-anchor="middle" fill="#92400E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800">SHIP</text>

      <circle cx="348" cy="172" r="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="348" y="169" text-anchor="middle" fill="#1D4ED8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">CI</text>
      <text x="348" y="184" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8">VERIFY</text>
    </g>

    <g transform="translate(24 246)">
      <text fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">contract → implementation → evidence → iteration</text>
      <circle cx="388" cy="-4" r="3" fill="#D97706"/>
    </g>
  </g>
</svg>
