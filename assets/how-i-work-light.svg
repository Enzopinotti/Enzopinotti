<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Enzo Pinotti — Operating model from discovery to delivery</title>
  <desc id="desc">Light seven-stage delivery loop covering discovery, definition, design, build, validation, release and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.52" stop-color="#0891B2"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#94A3B8"/></marker>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#CBD5E1" stroke-opacity="0.25" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)" stroke="#E2E8F0"/><rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <text x="48" y="44" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.2">OPERATING MODEL // BUSINESS → SYSTEM → DELIVERY</text><rect x="48" y="58" width="420" height="3" rx="1.5" fill="url(#line)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(44 94)"><rect width="142" height="92" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/><text x="18" y="27" fill="#0369A1" font-size="11" font-weight="800">01 · DISCOVER</text><text x="18" y="51" fill="#0F172A" font-size="13" font-weight="700">Process &amp; context</text><text x="18" y="72" fill="#64748B" font-size="10">users · pain · goals</text></g>
    <g transform="translate(204 94)"><rect width="142" height="92" rx="16" fill="#F5F3FF" stroke="#C4B5FD"/><text x="18" y="27" fill="#7C3AED" font-size="11" font-weight="800">02 · DEFINE</text><text x="18" y="51" fill="#312E81" font-size="13" font-weight="700">Requirements</text><text x="18" y="72" fill="#7C6CA6" font-size="10">AS-IS · TO-BE · scope</text></g>
    <g transform="translate(364 94)"><rect width="142" height="92" rx="16" fill="#F5F3FF" stroke="#C4B5FD"/><text x="18" y="27" fill="#7C3AED" font-size="11" font-weight="800">03 · DESIGN</text><text x="18" y="51" fill="#312E81" font-size="13" font-weight="700">Contract &amp; plan</text><text x="18" y="72" fill="#7C6CA6" font-size="10">ownership · deps · risk</text></g>
    <g transform="translate(524 94)"><rect width="142" height="92" rx="16" fill="#EFF6FF" stroke="#93C5FD"/><text x="18" y="27" fill="#2563EB" font-size="11" font-weight="800">04 · BUILD</text><text x="18" y="51" fill="#1E3A8A" font-size="13" font-weight="700">Implementation</text><text x="18" y="72" fill="#64748B" font-size="10">frontend · API · data</text></g>
    <g transform="translate(684 94)"><rect width="142" height="92" rx="16" fill="#ECFEFF" stroke="#67E8F9"/><text x="18" y="27" fill="#0891B2" font-size="11" font-weight="800">05 · VALIDATE</text><text x="18" y="51" fill="#155E75" font-size="13" font-weight="700">Evidence &amp; UAT</text><text x="18" y="72" fill="#64748B" font-size="10">tests · feedback · fixes</text></g>
    <g transform="translate(844 94)"><rect width="142" height="92" rx="16" fill="#FFFBEB" stroke="#FCD34D"/><text x="18" y="27" fill="#B45309" font-size="11" font-weight="800">06 · SHIP</text><text x="18" y="51" fill="#92400E" font-size="13" font-weight="700">Release</text><text x="18" y="72" fill="#A16207" font-size="10">cutover · rollout · docs</text></g>
    <g transform="translate(1004 94)"><rect width="152" height="92" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/><text x="18" y="27" fill="#2563EB" font-size="11" font-weight="800">07 · LEARN</text><text x="18" y="51" fill="#1E3A8A" font-size="13" font-weight="700">Production loop</text><text x="18" y="72" fill="#64748B" font-size="10">metrics · support · next</text></g>
  </g>
  <g stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"><line x1="188" y1="140" x2="201" y2="140"/><line x1="348" y1="140" x2="361" y2="140"/><line x1="508" y1="140" x2="521" y2="140"/><line x1="668" y1="140" x2="681" y2="140"/><line x1="828" y1="140" x2="841" y2="140"/><line x1="988" y1="140" x2="1001" y2="140"/></g>
  <path d="M1080 196 C1080 252 175 252 116 196" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="48" y="238" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">cross-cutting: stakeholders · dependencies · blockers · reporting · documentation · release evidence</text>
  <text x="48" y="264" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">feedback is not the end of the process — it becomes the next discovery input</text>
</svg>
