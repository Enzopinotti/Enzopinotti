<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Enzo Pinotti — Career arc</title>
  <desc id="desc">Career progression from data and visualization coordination to full-stack engineering and systems analysis / technical leadership.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0B1024"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#334155" stroke-opacity="0.12" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <text x="48" y="42" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.2">CAREER ARC // DATA → SOFTWARE → SYSTEMS &amp; DELIVERY</text>
  <rect x="48" y="58" width="500" height="3" rx="1.5" fill="url(#flow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(48 88)">
      <rect width="330" height="120" rx="18" fill="#071725" stroke="#1E4C61"/>
      <text x="20" y="30" fill="#67E8F9" font-size="12" font-weight="800">2021 → PRESENT · GIDAS</text>
      <text x="20" y="56" fill="#E2E8F0" font-size="16" font-weight="700">Data &amp; Visualization Coordination</text>
      <text x="20" y="81" fill="#94A3B8" font-size="11">requirements · KPIs · dashboards · iterative validation</text>
      <text x="20" y="101" fill="#64748B" font-size="10">development ↔ statistics ↔ engineering coordination</text>
    </g>
    <g transform="translate(404 88)">
      <rect width="330" height="120" rx="18" fill="#13102A" stroke="#4C3C78"/>
      <text x="20" y="30" fill="#C4B5FD" font-size="12" font-weight="800">2024 → 2025 · FEDES</text>
      <text x="20" y="56" fill="#EDE9FE" font-size="16" font-weight="700">Web / Full-Stack Engineer</text>
      <text x="20" y="81" fill="#A89AC7" font-size="11">React · Node.js · APIs · SQL · integrations</text>
      <text x="20" y="101" fill="#76658F" font-size="10">VPS · Docker · Nginx · SSL · deployments · troubleshooting</text>
    </g>
    <g transform="translate(760 88)">
      <rect width="392" height="120" rx="18" fill="#211806" stroke="#7C5812"/>
      <text x="20" y="30" fill="#FDE68A" font-size="12" font-weight="800">2025 → PRESENT · FEDES</text>
      <text x="20" y="56" fill="#FEF3C7" font-size="16" font-weight="700">Systems Analyst / Technical Lead</text>
      <text x="20" y="81" fill="#CBAE68" font-size="11">ERP/SaaS · AS-IS/TO-BE · BPMN · scope · backlog · risks</text>
      <text x="20" y="101" fill="#9A7A38" font-size="10">coordination · QA/UAT · releases · production follow-up</text>
    </g>
  </g>
  <path d="M378 148H398M734 148H754" stroke="#64748B" stroke-width="2"/>
  <circle cx="388" cy="148" r="4" fill="#8B5CF6"/><circle cx="744" cy="148" r="4" fill="#F59E0B"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">
    <text x="48" y="246" fill="#94A3B8">EDUCATION</text><text x="130" y="246" fill="#E2E8F0">Industrial Engineering · UTN La Plata · 2017–2023</text>
    <text x="528" y="246" fill="#94A3B8">CURRENT</text><text x="596" y="246" fill="#E2E8F0">Systems Engineering · since 2022</text>
    <text x="892" y="246" fill="#94A3B8">ENGLISH</text><text x="956" y="246" fill="#E2E8F0">B2 conversational</text>
    <text x="48" y="272" fill="#64748B">direction: technical-functional systems delivery · IT project coordination · ERP / operational software</text>
  </g>
