<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Enzo Pinotti — Operating model from discovery to delivery</title>
  <desc id="desc">A seven-stage delivery loop covering discovery, definition, design, build, validation, release and learning, with risks and reporting across the lifecycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0B1024"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.52" stop-color="#22D3EE"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#64748B"/></marker>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#334155" stroke-opacity="0.12" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <text x="48" y="44" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.2">OPERATING MODEL // BUSINESS → SYSTEM → DELIVERY</text><rect x="48" y="58" width="420" height="3" rx="1.5" fill="url(#line)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(44 94)"><rect width="142" height="92" rx="16" fill="#0F172A" stroke="#334155"/><text x="18" y="27" fill="#67E8F9" font-size="11" font-weight="800">01 · DISCOVER</text><text x="18" y="51" fill="#E2E8F0" font-size="13" font-weight="700">Process &amp; context</text><text x="18" y="72" fill="#64748B" font-size="10">users · pain · goals</text></g>
    <g transform="translate(204 94)"><rect width="142" height="92" rx="16" fill="#11152A" stroke="#4C3C78"/><text x="18" y="27" fill="#C4B5FD" font-size="11" font-weight="800">02 · DEFINE</text><text x="18" y="51" fill="#EDE9FE" font-size="13" font-weight="700">Requirements</text><text x="18" y="72" fill="#76658F" font-size="10">AS-IS · TO-BE · scope</text></g>
    <g transform="translate(364 94)"><rect width="142" height="92" rx="16" fill="#11152A" stroke="#4C3C78"/><text x="18" y="27" fill="#C4B5FD" font-size="11" font-weight="800">03 · DESIGN</text><text x="18" y="51" fill="#EDE9FE" font-size="13" font-weight="700">Contract &amp; plan</text><text x="18" y="72" fill="#76658F" font-size="10">ownership · deps · risk</text></g>
    <g transform="translate(524 94)"><rect width="142" height="92" rx="16" fill="#0C1726" stroke="#315C78"/><text x="18" y="27" fill="#7DD3FC" font-size="11" font-weight="800">04 · BUILD</text><text x="18" y="51" fill="#E0F2FE" font-size="13" font-weight="700">Implementation</text><text x="18" y="72" fill="#5F7899" font-size="10">frontend · API · data</text></g>
    <g transform="translate(684 94)"><rect width="142" height="92" rx="16" fill="#082329" stroke="#197D88"/><text x="18" y="27" fill="#67E8F9" font-size="11" font-weight="800">05 · VALIDATE</text><text x="18" y="51" fill="#CFFAFE" font-size="13" font-weight="700">Evidence &amp; UAT</text><text x="18" y="72" fill="#527887" font-size="10">tests · feedback · fixes</text></g>
    <g transform="translate(844 94)"><rect width="142" height="92" rx="16" fill="#261A0A" stroke="#8F6110"/><text x="18" y="27" fill="#FDE68A" font-size="11" font-weight="800">06 · SHIP</text><text x="18" y="51" fill="#FEF3C7" font-size="13" font-weight="700">Release</text><text x="18" y="72" fill="#A9803A" font-size="10">cutover · rollout · docs</text></g>
    <g transform="translate(1004 94)"><rect width="152" height="92" rx="16" fill="#111827" stroke="#334155"/><text x="18" y="27" fill="#93C5FD" font-size="11" font-weight="800">07 · LEARN</text><text x="18" y="51" fill="#DBEAFE" font-size="13" font-weight="700">Production loop</text><text x="18" y="72" fill="#64748B" font-size="10">metrics · support · next</text></g>
  </g>
  <g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"><line x1="188" y1="140" x2="201" y2="140"/><line x1="348" y1="140" x2="361" y2="140"/><line x1="508" y1="140" x2="521" y2="140"/><line x1="668" y1="140" x2="681" y2="140"/><line x1="828" y1="140" x2="841" y2="140"/><line x1="988" y1="140" x2="1001" y2="140"/></g>
  <path d="M1080 196 C1080 252 175 252 116 196" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="48" y="238" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">cross-cutting: stakeholders · dependencies · blockers · reporting · documentation · release evidence</text>
  <text x="48" y="264" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">feedback is not the end of the process — it becomes the next discovery input</text>
</svg>
