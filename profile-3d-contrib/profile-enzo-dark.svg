<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Enzo Pinotti 3D contribution landscape</title>
  <desc id="desc">Bootstrap placeholder that will be replaced by the generated GitHub 3D contribution landscape after the workflow is run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#101733"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.58" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.42" stroke="#334155">
    <path d="M110 255 L490 95 L870 255" fill="none"/>
    <path d="M145 270 L490 130 L835 270" fill="none"/>
    <path d="M180 285 L490 165 L800 285" fill="none"/>
  </g>
  <g transform="translate(170 158)">
    <rect x="0" y="68" width="30" height="54" rx="4" fill="#312E81"/>
    <rect x="42" y="42" width="30" height="80" rx="4" fill="#6D28D9"/>
    <rect x="84" y="12" width="30" height="110" rx="4" fill="#0EA5E9"/>
    <rect x="126" y="55" width="30" height="67" rx="4" fill="#38BDF8"/>
    <rect x="168" y="26" width="30" height="96" rx="4" fill="#F59E0B"/>
  </g>
  <g transform="translate(470 118)">
    <text x="0" y="0" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">CONTRIBUTION LANDSCAPE</text>
    <rect x="0" y="20" width="330" height="4" rx="2" fill="url(#line)"/>
    <text x="0" y="60" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">custom 3D profile graph</text>
    <text x="0" y="88" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Run “Refresh profile 3D contribution landscape”</text>
    <text x="0" y="108" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">after merge to replace this bootstrap asset.</text>
  </g>
</svg>