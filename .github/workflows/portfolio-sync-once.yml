name: Portfolio sync once

on:
  push:
    branches:
      - docs/web-profesores-complete-pintar-next
    paths:
      - ".github/workflows/portfolio-sync-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out coordination branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: docs/web-profesores-complete-pintar-next

      - name: Synchronize portfolio state
        run: python3 .github/scripts/sync-portfolio-once.py

      - name: Validate synchronized profile
        run: python3 .github/scripts/validate-profile.py

      - name: Commit synchronized portfolio state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/repository-portfolio-roadmap-2026.md .github/scripts/validate-profile.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: complete Web-de-profesores and select Pint.ar P2"
          git push origin HEAD:docs/web-profesores-complete-pintar-next
