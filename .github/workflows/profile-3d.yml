name: Refresh profile 3D contribution landscape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate custom contribution landscape
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate Enzo contribution themes
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit changed generated assets
        shell: bash
        run: |
          if git diff --quiet -- profile-3d-contrib; then
            echo "3D contribution assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git commit -m "chore(profile): refresh 3d contribution landscape"
          git push
