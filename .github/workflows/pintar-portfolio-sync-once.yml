name: Sync Pint.ar completion to portfolio once

on:
  push:
    branches:
      - docs/pintar-complete-meow-next
    paths:
      - ".github/workflows/pintar-portfolio-sync-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: docs/pintar-complete-meow-next

      - name: Apply deterministic portfolio sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/sync-pintar-completion-once.py')
          source = path.read_text(encoding='utf-8')

          old_tail = '''roadmap = replace_section(
              roadmap,
              "## 12. Next decision gate",
              "## 13.",
              next_gate,
              "roadmap next decision gate",
          )'''
          new_tail = '''next_gate_start = roadmap.find("## 12. Next decision gate")
          if next_gate_start < 0:
              raise SystemExit("roadmap next decision gate: start marker missing")
          roadmap = roadmap[:next_gate_start] + next_gate.rstrip() + "\\n"'''
          if source.count(old_tail) != 1:
              raise SystemExit('expected one final decision-gate selector to repair')
          source = source.replace(old_tail, new_tail, 1)

          old_story = '''validator = replace_once(
              validator,
              '        "Pint.ar_Ecommerce",\\n',
              '        "Pint.ar_Ecommerce",\\n        "Meow Matrix",\\n        "20/20 tests",\\n',
              "validator README story",
          )'''
          new_story = '''story_anchor = '        "Pint.ar_Ecommerce",\\n'
          if story_anchor not in validator:
              raise SystemExit("validator README story: anchor missing")
          validator = validator.replace(
              story_anchor,
              '        "Pint.ar_Ecommerce",\\n        "Meow Matrix",\\n        "20/20 tests",\\n',
              1,
          )'''
          if source.count(old_story) != 1:
              raise SystemExit('expected one validator README-story selector to repair')
          source = source.replace(old_story, new_story, 1)

          exec(compile(source, str(path), 'exec'), {'__file__': str(path), '__name__': '__main__'})
          PY

      - name: Validate profile authority
        run: python3 .github/scripts/validate-profile.py

      - name: Commit synchronized authority files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/repository-portfolio-roadmap-2026.md .github/scripts/validate-profile.py
          git diff --cached --check
          git commit -m "docs: complete Pint.ar and select Meow Matrix ecommerce lane"
          git push origin HEAD:docs/pintar-complete-meow-next
